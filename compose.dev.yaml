name: spiessgesell-innen-dev

services:
  app:
    build: .
    image: spiessgesell-innen:dev
    container_name: spiessgesell-innen-dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      BASE_URL: http://127.0.0.1:${DEV_PORT:-8090}
      BACKUP_ENABLED: "0"
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./app:/app/app
      - ./seed:/app/seed
      - data-dev:/data
    ports:
      - "127.0.0.1:${DEV_PORT:-8090}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    security_opt:
      - no-new-privileges:true

volumes:
  data-dev:

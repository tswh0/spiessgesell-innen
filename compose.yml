name: spiessgesell-innen

services:
  app:
    build: .
    image: spiessgesell-innen:local
    container_name: spiessgesell-innen
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-8095}:8000"
    security_opt:
      - no-new-privileges:true

name: spiessgesell-innen

services:
  app:
    image: ghcr.io/tswh0/spiessgesell-innen:${IMAGE_TAG:-latest}
    container_name: spiessgesell-innen
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      BACKUP_ENABLED: "1"
      BACKUP_DIR: /backups
      BACKUP_KEEP: "14"
      BACKUP_AT: "03:15"
      TZ: ${TZ:-Europe/Berlin}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - data:/data
      - backups:/backups
    ports:
      - "127.0.0.1:${APP_PORT:-8095}:8000"
    security_opt:
      - no-new-privileges:true

volumes:
  data:
  backups:
